name: Build and publish releases

# Produces the downloadable builds and publishes them as a release, which is
# what the in-app updater reads. Without this, the updater has nothing to find
# on this repository and every user has to download by hand forever.
#
# Every push to main publishes a rolling release at the fixed tag `latest`, so an
# installed copy can always update itself. Pushing a v* tag also publishes a
# versioned release, which is the one that shows as "latest".

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The suite gates the release: publishing a broken build to everyone who has
  # auto-update is the worst place to skip tests.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The Linux-only GUI bindings are not needed to run the suite.
          sed -i '/PyGObject/d; /PySide6/d' requirements.txt
          pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build the application folder
        run: pyinstaller --noconfirm --clean AutoRewarder.spec

      - name: Assemble the download
        shell: pwsh
        run: |
          $app = "dist/AutoRewarder"
          if (!(Test-Path "$app/AutoRewarder.exe")) {
            throw "The build did not produce AutoRewarder.exe."
          }

          # The UI has to be inside the bundle, or the window opens blank. Its
          # location depends on the PyInstaller version, so allow either.
          $ui = @("$app/gui/index.html", "$app/_internal/gui/index.html")
          if (!($ui | Where-Object { Test-Path $_ })) {
            throw "The build is missing the application UI."
          }

          # Windows marks every file extracted from a downloaded ZIP as coming
          # from the Internet, and .NET then refuses to load the marked
          # assemblies, so a downloaded exe cannot start at all. The app cannot
          # clear that mark on itself, so ship a launcher that does it first.
          Copy-Item -Path "scripts/Start-AutoRewarder.ps1" -Destination "$app/Start-AutoRewarder.ps1" -Force
          if (!(Test-Path "$app/Start-AutoRewarder.ps1")) {
            throw "The build is missing the launcher."
          }

          $readme = @(
            "AutoRewarder",
            "============",
            "",
            "FIRST RUN: double-click Start-AutoRewarder.ps1, not AutoRewarder.exe.",
            "",
            "Windows marks files that arrive in a ZIP as downloaded, and refuses to",
            "load them until that mark is cleared. The launcher clears it, then starts",
            "the app. After the first run you can use AutoRewarder.exe directly.",
            "",
            "If Windows blocks the script, run this in PowerShell:",
            "",
            "    powershell -ExecutionPolicy Bypass -File .\Start-AutoRewarder.ps1"
          ) -join "`r`n"
          Set-Content -Path "$app/READ-ME-FIRST.txt" -Value $readme -Encoding UTF8

          Compress-Archive -Path $app -DestinationPath "dist/AutoRewarder-windows.zip" -CompressionLevel Optimal -Force

      - name: Check the archive is whole
        shell: pwsh
        run: |
          $zip = Get-Item dist/AutoRewarder-windows.zip
          Write-Host "archive: $($zip.Length) bytes"
          if ($zip.Length -lt 10MB) { throw "The archive looks truncated." }

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AutoRewarder-windows
          path: dist/AutoRewarder-windows.zip
          if-no-files-found: error

  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # Qt is the windowing backend on Linux, and is part of the app's own
          # requirements for that platform.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0 libwebkit2gtk-4.1-0
          pip install -r requirements-dev.txt

      - name: Build the application folder
        run: pyinstaller --noconfirm --clean AutoRewarder.spec

      - name: Assemble the download
        run: |
          set -euo pipefail
          app=dist/AutoRewarder

          test -x "$app/AutoRewarder" || { echo "::error::no executable produced"; exit 1; }
          test -f "$app/gui/index.html" || test -f "$app/_internal/gui/index.html" \
            || { echo "::error::the UI is missing from the build"; exit 1; }

          # A downloaded tar.gz keeps its permissions, so this is what makes the
          # extracted copy runnable without the user chmod-ing anything.
          chmod +x "$app/AutoRewarder"

          cat > "$app/READ-ME-FIRST.txt" <<'EOF'
          AutoRewarder (Linux)
          ====================

          Run ./AutoRewarder from this folder.

          If it reports "Permission denied", make it executable and run it again:

              chmod +x ./AutoRewarder
              ./AutoRewarder

          AutoRewarder updates itself: Settings -> About -> Check for updates.
          EOF

          tar -czf dist/AutoRewarder-linux.tar.gz -C dist AutoRewarder

          ls -l dist/AutoRewarder-linux.tar.gz

      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: AutoRewarder-linux
          path: dist/AutoRewarder-linux.tar.gz
          if-no-files-found: error

  # One release carrying both platforms, published only when every build
  # succeeded. A partial release would hand half the users a download that
  # doesn't contain their platform.
  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the downloads
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} out/ \;
          ls -l out

      # Rolling release: fixed tag, replaced on every push to main. The updater
      # compares its own version against this release, so the tag must stay
      # stable while the contents move.
      - name: Publish the rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: AutoRewarder (latest build)
          body: |
            Latest build of AutoRewarder, for Windows and Linux.

            **Windows**
            1. Download `AutoRewarder-windows.zip` and extract it somewhere writable (not Program Files).
            2. Run `Start-AutoRewarder.ps1` the first time. It clears Windows' download marker, which otherwise stops the app from starting, then launches it.
            3. After that, `AutoRewarder.exe` starts directly.

            **Linux**
            1. Download `AutoRewarder-linux.tar.gz` and extract it.
            2. Run `./AutoRewarder`. If it says "Permission denied", `chmod +x ./AutoRewarder` first.

            From now on the app updates itself: **Settings → About → Check for updates** reports a newer build and links to it.

            Built from `main` at ${{ github.sha }}.
          files: out/*
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish the versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoRewarder ${{ github.ref_name }}
          body: |
            AutoRewarder ${{ github.ref_name }}, for Windows and Linux.

            Windows: extract `AutoRewarder-windows.zip` and run `Start-AutoRewarder.ps1` the first time.
            Linux: extract `AutoRewarder-linux.tar.gz` and run `./AutoRewarder`.

            Built from ${{ github.sha }}.
          files: out/*
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
