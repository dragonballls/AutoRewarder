name: Build AutoRewarder with local Ollama helper

on:
  push:
    branches:
      - feat/local-ollama-support-assistant
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feat/local-ollama-support-assistant

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Run Ollama integration tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build Windows application folder
        run: pyinstaller --noconfirm --clean AutoRewarder.spec

      - name: Package Windows application
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AutoRewarder/AutoRewarder.exe")) {
            throw "The Windows build did not produce AutoRewarder.exe."
          }
          if (!(Test-Path "dist/AutoRewarder/gui/ai_helper.html")) {
            throw "The Windows build is missing the Ollama helper UI."
          }
          Compress-Archive -Path "dist/AutoRewarder" -DestinationPath "dist/AutoRewarder-Ollama-Windows.zip" -CompressionLevel Optimal -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRewarder-Ollama-Windows
          path: dist/AutoRewarder-Ollama-Windows.zip
          if-no-files-found: error
          retention-days: 30
