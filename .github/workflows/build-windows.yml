name: Build AutoRewarder Ollama edition

on:
  push:
    branches:
      - feat/local-ollama-support-assistant
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feat/local-ollama-support-assistant

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Run Ollama integration tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build Windows application folder
        run: pyinstaller --noconfirm --clean AutoRewarder.spec

      - name: Package Windows application
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AutoRewarder-Ollama/AutoRewarder-Ollama.exe")) {
            throw "The Windows build did not produce AutoRewarder-Ollama.exe."
          }
          # The read-only AI helper was removed: AutoRewarder exists to complete
          # Rewards tasks, and a chat assistant that only explains settings or
          # logs does not earn points. Guard the main window instead.
          $windowCandidates = @(
            "dist/AutoRewarder-Ollama/gui/index.html",
            "dist/AutoRewarder-Ollama/_internal/gui/index.html"
          )
          if (!($windowCandidates | Where-Object { Test-Path $_ })) {
            throw "The Windows build is missing the application UI."
          }
          # Ship the launcher beside the exe. Windows marks every file from a
          # downloaded ZIP as coming from the Internet, and .NET then refuses to
          # load the marked assemblies - a marked exe cannot start at all, so the
          # app cannot unblock itself. This script clears the mark, then launches.
          Copy-Item -Path "scripts/Start-AutoRewarder.ps1" -Destination "dist/AutoRewarder-Ollama/Start-AutoRewarder.ps1" -Force
          if (!(Test-Path "dist/AutoRewarder-Ollama/Start-AutoRewarder.ps1")) {
            throw "The Windows build is missing the launcher."
          }
          Compress-Archive -Path "dist/AutoRewarder-Ollama" -DestinationPath "dist/AutoRewarder-Ollama-Windows.zip" -CompressionLevel Optimal -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRewarder-Ollama-Windows
          path: dist/AutoRewarder-Ollama-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autorewarder-ollama-preview
          target_commitish: feat/local-ollama-support-assistant
          name: AutoRewarder Ollama Preview
          body: |
            Automated Windows preview build of the AutoRewarder fork with the selectable local Ollama LLM provider.

            Source branch: feat/local-ollama-support-assistant
            Build commit: ${{ github.sha }}

            This is a preview build. Keep your previous installation and data backup until the new build is verified.
          prerelease: true
          make_latest: false
          files: dist/AutoRewarder-Ollama-Windows.zip
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
