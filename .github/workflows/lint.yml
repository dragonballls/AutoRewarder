name: AutoRewarder Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The Linux GUI stack lives in requirements-linux.txt, so the test and
        # lint jobs install the app's requirements as they are. They used to
        # delete PyGObject and PySide6 from requirements.txt here, which mutated
        # a tracked file and made the checks depend on that mutation.
        pip install -r requirements-dev.txt

    # pep8, code formatting, and type checking
    - name: Run Black
      run: |
        black . --check

    # linting
    - name: Run Flake8
      run: |
        flake8 .

    # type checking
    - name: Run MyPy
      run: |
        mypy .

    # Unit tests. Installed from requirements-dev.txt above; selenium and
    # requests come with the app's own requirements. The suite is
    # deterministic and offline — nothing here needs an API key or the network.
    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -t . -v
