name: Sequential account demo settings tests

on:
  push:
    branches: [feat/classroom-sequential-account-demo]
    paths:
      - "src/accounts/settings.py"
      - "tests/accounts/**"
      - ".github/workflows/sequential-demo-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/accounts/settings.py"
      - "tests/accounts/**"
      - ".github/workflows/sequential-demo-tests.yml"

permissions:
  contents: read

jobs:
  settings-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Run settings regression tests
        run: python -m unittest discover -s tests/accounts -v
