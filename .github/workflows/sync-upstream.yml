name: Sync original AutoRewarder updates

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autorewarder-upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the maintained AI-enabled branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-ollama-support-assistant
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure sync identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge original AutoRewarder
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/safarsin/AutoRewarder.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "The maintained branch already contains the latest upstream commit."
            exit 0
          fi

          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort
            echo "::error::Upstream changes conflict with the maintained branch. No files were overwritten. Resolve the merge manually, then rerun this workflow."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Any 3.12 satisfies the pins; the runner's default interpreter is
          # newer than Pillow 10.4.0 publishes wheels for. The patch version is
          # left floating because ubuntu-latest no longer ships 3.12.10.
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Run the test suite
        run: |
          # The suite imports the app's own modules, so it needs the app's
          # dependencies, not just requests. The Linux GUI stack is a separate
          # file and the tests do not use it, so it is not installed here.
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -t . -v

      - name: Push upstream-compatible branch
        run: git push origin HEAD:feat/local-ollama-support-assistant

      - name: Trigger a Windows rebuild for the maintained branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dragonballls/AutoRewarder/actions/workflows/build-windows.yml/dispatches \
            -d '{"ref":"feat/local-ollama-support-assistant"}'
