name: Verify published download (manual)

on:
  workflow_dispatch:

jobs:
  verify-published-download:
    runs-on: windows-latest
    steps:
      - name: Download the public release asset
        shell: pwsh
        run: |
          $url = "https://github.com/dragonballls/AutoRewarder/releases/download/autorewarder-ollama-preview/AutoRewarder-Ollama-Windows.zip"
          New-Item -ItemType Directory -Path dl | Out-Null
          Invoke-WebRequest -Uri $url -OutFile dl/app.zip
          $len = (Get-Item dl/app.zip).Length
          Write-Host "downloaded $len bytes"
          if ($len -lt 10MB) { Write-Host "::error::asset looks truncated"; exit 1 }

      - name: Extract the way a user does, marker and all
        shell: pwsh
        run: |
          # A browser download leaves Zone.Identifier on the zip; Explorer
          # propagates it to every extracted file.
          Set-Content -Path dl/app.zip -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3`n" -NoNewline
          Expand-Archive -Path dl/app.zip -DestinationPath ex -Force
          Get-ChildItem ex -Recurse -File |
            ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3`n" -NoNewline }
          $marked = (Get-ChildItem ex -Recurse -File |
            Where-Object { (Get-Item $_.FullName -Stream *).Stream -contains "Zone.Identifier" }).Count
          Write-Host "marked files: $marked"
          if ($marked -lt 100) { Write-Host "::error::could not reproduce a download"; exit 1 }

      - name: The launcher must ship in the archive
        shell: pwsh
        run: |
          $l = "ex/AutoRewarder-Ollama/Start-AutoRewarder.ps1"
          if (!(Test-Path $l)) {
            Write-Host "::error::the archive does not contain Start-AutoRewarder.ps1, so a downloaded build cannot be started."
            exit 1
          }
          Write-Host "launcher present"

      - name: Start it the documented way (launcher)
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "ex/AutoRewarder-Ollama/Start-AutoRewarder.ps1" -AppPath "ex/AutoRewarder-Ollama" 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "launcher: $_" }
          if ($code -ne 0) { Write-Host "::error::the launcher failed"; exit 1 }
          $left = (Get-ChildItem ex -Recurse -File |
            Where-Object { (Get-Item $_.FullName -Stream *).Stream -contains "Zone.Identifier" }).Count
          Write-Host "files still marked after the launcher: $left"
          if ($left -ne 0) { Write-Host "::error::the launcher left marked files behind"; exit 1 }

      - name: The app must actually be running
        shell: pwsh
        run: |
          Start-Sleep -Seconds 30
          $p = Get-Process -Name "AutoRewarder-Ollama" -ErrorAction SilentlyContinue
          if (!$p) { Write-Host "::error::the launcher started nothing, or the app died"; exit 1 }
          Write-Host "OK: the downloaded build is running (pid $($p.Id))"
          $p | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: The installed copy must start too (installer path)
        shell: pwsh
        run: |
          # The installer is the other supported route; it unblocks the copied
          # tree before it launches. Run it against the extracted archive so no
          # network download is needed.
          $script = "ex/AutoRewarder-Ollama/Start-AutoRewarder.ps1"
          if (!(Test-Path $script)) { Write-Host "::error::launcher missing"; exit 1 }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File $script -AppPath "ex/AutoRewarder-Ollama" -NoLaunch 2>&1
          $out | ForEach-Object { Write-Host "launcher(-NoLaunch): $_" }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::-NoLaunch failed"; exit 1 }
          Write-Host "OK: -NoLaunch prepares the tree without starting the app"
